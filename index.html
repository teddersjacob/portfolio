    <!-- ============================================================ -->
    <!-- Adobe Target — Anti-flicker snippet                          -->
    <!-- Hides body until at.js fires its first page-load request,    -->
    <!-- then reveals it (or after 3 s as a safety net).              -->
    <!-- ============================================================ -->
    <style id="at-body-style">body { opacity: 0 !important }</style>
    <script>
      (function (doc, timeout) {
        var STYLE_ID = 'at-body-style';
        function removeStyle() {
          var el = doc.getElementById(STYLE_ID);
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
        // Safety-net: always reveal after timeout even if at.js fails
        setTimeout(removeStyle, timeout);
        // Reveal as soon as Target fires its first request
        window.addEventListener('at-request-succeeded', removeStyle, { once: true });
        window.addEventListener('at-request-failed',    removeStyle, { once: true });
      }(document, 3000));
    </script>

    <!--   Copy clientCode, imsOrgId, and serverDomain from there.   -->

    <script>
      window.targetGlobalSettings = {
        // ── Required ─────────────────────────────────────────────────
        clientCode:   "targetdataplatform",
        imsOrgId:     "6FC947105BB267B70A495EE9@AdobeOrg",
        serverDomain: "targetdataplatform.tt.omtrdc.net",

        // ── Timeouts ────────────────────────────────────────────────
        timeout:            2000,   // ms to wait for a Target response
        visitorApiTimeout:  2000,   // ms to wait for Visitor API

        // ── Page-load / global mbox ─────────────────────────────────
        globalMboxAutoCreate: true,   // fire target-global-mbox automatically
        pageLoadEnabled:      true,

        // ── Flicker control ─────────────────────────────────────────
        bodyHidingEnabled:          true,
        bodyHiddenStyle:            "body{opacity:0 !important}",
        defaultContentHiddenStyle:  "visibility:hidden;",
        defaultContentVisibleStyle: "visibility:visible;",

        // ── Misc ────────────────────────────────────────────────────
        crossDomain:    "disabled",
        secureOnly:     true,
        optoutEnabled:  false,
        optinEnabled:   false,
      };
    </script>
